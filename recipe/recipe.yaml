schema_version: 1

# The Git tags originally used the format YYYY-MM-DD, which we adopted for this
# recipe. More recent tags are no longer consistent (eg LTS_07_2022_Ref02), so
# we rearrange the tag into the version string:
#
#     LTS_MM_YYYY_RefRR --> YYYY.MM.postRR
#
# `post` is not meant literally here: RefRR is a distinct upstream revision
# rather than a repackage of identical source. It is used because conda and
# rattler both order a `post` suffix above the bare version, which keeps the
# refreshes of an LTS line ascending. A `refRR` suffix would instead be read
# as a string component and sort *below* the bare version.
#
# Releases: https://github.com/Azure/azure-uamqp-c/tags
context:
  name: azure-uamqp-c
  version: "2022.07.post2"
  tag: LTS_07_2022_Ref02

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/Azure/azure-uamqp-c/archive/${{ tag }}.tar.gz
    sha256: f086b1b0bbfd098749ce960d2e04f481dd6e51e580236a3f8a8238eed0bbd294

build:
  number: 0
  skip: not win64

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - azure-c-shared-utility
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}

tests:
  - package_contents:
      files:
        - Library/bin/uamqp.dll
        - Library/lib/uamqp.lib

about:
  license: MIT
  license_file: LICENSE
  summary: uAMQP is a general purpose C library for AMQP 1.0.
  homepage: https://github.com/Azure/azure-uamqp-c
  repository: https://github.com/Azure/azure-uamqp-c

extra:
  recipe-maintainers:
    - xylar
    - seanyen
