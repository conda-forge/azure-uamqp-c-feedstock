schema_version: 1

context:
  name: azure-uamqp-c
  version: "2019.12.09"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/Azure/azure-uamqp-c/archive/LTS_02_2020_Ref01.tar.gz
    sha256: 8920d1ff729d6cc9c03b6b6d5d57490d8ab06aeca16279a6f3f940287601c9b3

build:
  number: 1
  skip: not win64

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - azure-c-shared-utility
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}

tests:
  - package_contents:
      files:
        - Library/bin/uamqp.dll
        - Library/lib/uamqp.lib

about:
  license: MIT
  license_file: LICENSE
  summary: uAMQP is a general purpose C library for AMQP 1.0.
  homepage: https://github.com/Azure/azure-uamqp-c
  repository: https://github.com/Azure/azure-uamqp-c

extra:
  recipe-maintainers:
    - xylar
    - seanyen
